name: run-tests

on:
  push:
    paths:
      - '**.php'
      - '.github/workflows/**'
      - 'phpunit.xml.dist'
      - 'composer.json'
      - 'composer.lock'
  pull_request:
    paths:
      - '**.php'
      - '.github/workflows/**'
      - 'phpunit.xml.dist'
      - 'composer.json'
      - 'composer.lock'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: true
      matrix:
        php: [8.5, 8.4]
        laravel: [13.*, 12.*]
        stability: [prefer-stable]
        include:
          - laravel: 13.*
            testbench: 11.*
          - laravel: 12.*
            testbench: 10.*
          # Test lowest dependencies on the lowest supported PHP version only
          - php: 8.4
            laravel: 13.*
            testbench: 11.*
            stability: prefer-lowest
          - php: 8.4
            laravel: 12.*
            testbench: 10.*
            stability: prefer-lowest

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip
          coverage: none
          tools: composer:2.11.2@sha256:dd158c0afd41d15fac89e1b4e47b5d42911fe316c3687cd5edac98319b25d028

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        env:
          LARAVEL: ${{ matrix.laravel }}
          TESTBENCH: ${{ matrix.testbench }}
          STABILITY: ${{ matrix.stability }}
        run: |
          composer require "laravel/framework:$LARAVEL" "orchestra/testbench:$TESTBENCH" --no-interaction --no-update
          composer update "--$STABILITY" --prefer-dist --no-interaction

      - name: List Installed Dependencies
        run: composer show -D

      - name: Create env file
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: printf '%s\n' "$ENV_FILE" > .env.testing

      - name: Execute tests
        run: vendor/bin/pest --ci
